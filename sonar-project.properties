sonar.projectKey=felipetaisdiaz-hub_ds-python-boilerplate
sonar.organization=felipetaisdiaz-hub
sonar.projectName=ds-python-boilerplate
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.13

# Excluir archivos de soporte del análisis estático y los tests del cálculo de cobertura
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/*.md,**/.github/**,**/uv.lock,**/notebooks/**,**/scripts/**
sonar.coverage.exclusions=**/tests/**

# Configuración de cobertura y pruebas generadas en la raíz
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

sonar.qualitygate.wait=true

