sonar.projectKey=felipetaisdiaz-hub_ds-python-boilerplate
sonar.organization=felipetaisdiaz-hub
sonar.projectName=ds-python-boilerplate
sonar.projectVersion=1.0

sonar.language=py
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.14

# Excluir de análisis estático (actualizado a la nueva carpeta tests)
sonar.exclusions=**/tests/**,**/.venv/**,**/__pycache__/**,**/*.md,**/.github/**,**/uv.lock

# Configuración de cobertura y pruebas (ahora se generarán en la raíz)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

sonar.qualitygate.wait=true
