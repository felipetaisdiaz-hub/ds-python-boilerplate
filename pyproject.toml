[project]
name = "ds-python-boilerplate"
version = "0.1.0"
description = "Plantilla base agnóstica y estandarizada para proyectos de Data Science y Machine Learning en Python."
readme = "README.md"
authors = [
    { name = "Felipe", email = "felipetaisdiaz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ds-python-boilerplate = "ds_python_boilerplate:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
]
notebooks = [
    "ipykernel>=6.29.0",
    "nbstripout>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

